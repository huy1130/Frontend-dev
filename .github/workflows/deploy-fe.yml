name: Deploy FE to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hybridwash-fe-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: hybridwash-fe-prod-844217827892
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.FE_CLOUDFRONT_DISTRIBUTION_ID }}
  SITE_URL: https://hybridwash.io.vn

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check deployment configuration
        run: test -n "$CLOUDFRONT_DISTRIBUTION_ID"

      - name: Deploy frontend files
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --delete \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public,max-age=3600"

          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Verify production site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$SITE_URL/" > /dev/null
